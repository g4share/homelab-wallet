services:
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1-alpine
    container_name: beszel-agent
    user: "5000:5000"
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - ${BESZEL_DISK_1}
      - ${BESZEL_DISK_2}
    environment:
      HUB_URL: http://10.0.0.15:8090
      BESZEL_AGENT_KEY_FILE: /run/secrets/BESZEL_AGENT_KEY
      BESZEL_AGENT_TOKEN_FILE: /run/secrets/BESZEL_AGENT_TOKEN
      DISABLE_SSH: "true"
    secrets:
      - BESZEL_AGENT_KEY
      - BESZEL_AGENT_TOKEN
    volumes:
      - /mnt/data/volumes/beszel/agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro

secrets:
  BESZEL_AGENT_KEY:
    file: /dev/shm/homelab-wallet/secrets/beszel/BESZEL_AGENT_KEY
  BESZEL_AGENT_TOKEN:
    file: /dev/shm/homelab-wallet/secrets/beszel/BESZEL_AGENT_TOKEN
