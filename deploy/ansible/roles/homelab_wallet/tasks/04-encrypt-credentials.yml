---
- name: Check the systemd version on the target
  ansible.builtin.command:
    argv:
      - systemd-creds
      - --version
  register: systemd_creds_version
  changed_when: false

- name: Extract the systemd version number
  ansible.builtin.set_fact:
    systemd_creds_version_number: "{{ systemd_creds_version.stdout.split()[1].split('.')[0] | int }}"

- name: Require systemd 250 or newer for encrypted credentials
  ansible.builtin.assert:
    that:
      - systemd_creds_version_number | int >= 250
    fail_msg: systemd 250 or newer is required for encrypted credentials.

- name: Ensure the encrypted credential directory exists
  ansible.builtin.file:
    path: /etc/credstore.encrypted
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Process each Bitwarden credential
  ansible.builtin.include_tasks: 04-encrypt-one-credential.yml
  vars:
    homelab_wallet_credentials:
      - name: bw-client-id
        prompt: "Bitwarden Password Manager API client ID:"
      - name: bw-client-secret
        prompt: "Bitwarden Password Manager API client secret:"
      - name: bw-master-password
        prompt: "Bitwarden Password Manager master password:"
  loop: "{{ homelab_wallet_credentials }}"
  loop_control:
    loop_var: credential
    label: "{{ credential.name }}"
