---
- name: Check whether the encrypted credential exists
  ansible.builtin.stat:
    path: "/etc/credstore.encrypted/{{ credential.name }}"
  register: encrypted_credential_file

- name: Prompt for the credential when missing or forced
  ansible.builtin.pause:
    prompt: "{{ credential.prompt }}"
    echo: false
  register: credential_prompt
  when: force_credentials | bool or not encrypted_credential_file.stat.exists
  no_log: true

- name: Ensure the credential is not empty when updating it
  ansible.builtin.assert:
    that:
      - (credential_prompt.user_input | default('')) | length > 0
    fail_msg: "{{ credential.name }} must be provided."
  when: force_credentials | bool or not encrypted_credential_file.stat.exists
  no_log: true

- name: Encrypt the credential with systemd-creds when missing or forced
  ansible.builtin.command:
    argv:
      - systemd-creds
      - encrypt
      - "--name={{ credential.name }}"
      - "-"
      - "/etc/credstore.encrypted/{{ credential.name }}"
    stdin: "{{ credential_prompt.user_input | default('') }}"
    stdin_add_newline: false
  when: force_credentials | bool or not encrypted_credential_file.stat.exists
  no_log: true

- name: Set restrictive permissions on the encrypted credential
  ansible.builtin.file:
    path: "/etc/credstore.encrypted/{{ credential.name }}"
    state: file
    owner: root
    group: root
    mode: '0600'
