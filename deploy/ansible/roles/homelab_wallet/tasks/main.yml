---
- name: First pass - create the service account
  ansible.builtin.import_tasks: 01_create_user.yml

- name: Second pass - install the native Bitwarden CLI
  ansible.builtin.import_tasks: 02_install_bw.yml

- name: Third pass - install the app and host configuration
