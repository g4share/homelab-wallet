---
- name: Install the Homelab Wallet systemd unit
  ansible.builtin.copy:
    src: homelab-wallet.service
    dest: /etc/systemd/system/homelab-wallet.service
    owner: root
    group: root
    mode: '0644'

- name: Ensure the Docker systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the Docker ordering drop-in
  ansible.builtin.copy:
    src: docker.service.conf
    dest: /etc/systemd/system/docker.service.d/homelab-wallet.conf
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd manager configuration
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and restart the Homelab Wallet service
  ansible.builtin.systemd_service:
    name: homelab-wallet.service
    enabled: true
    state: restarted
