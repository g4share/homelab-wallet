name: Build release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Raspberry Pi and macOS Apple Silicon binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux_arm64 darwin_arm64; do
            GOOS="${target%_*}" GOARCH="${target#*_}" go build -trimpath \
              -ldflags "-X main.version=${VERSION}" \
              -o dist/homelab-wallet "./cmd/homelab-wallet"

            archive="homelab-wallet_${VERSION}_${target}.tar.gz"
            tar -C dist -czf "dist/${archive}" homelab-wallet
            rm dist/homelab-wallet
          done

          cd dist
          sha256sum homelab-wallet_*.tar.gz > SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            dist/homelab-wallet_*.tar.gz \
            dist/SHA256SUMS \
            --title "${VERSION}" \
            --generate-notes
